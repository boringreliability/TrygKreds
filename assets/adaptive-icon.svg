<?xml version="1.0" encoding="UTF-8"?>
<!-- Android adaptive icon foreground.

     Full-bleed rather than a transparent foreground on purpose: the launcher
     crops this to whatever mask shape it uses (circle, squircle, rounded
     square), so the outer edge must carry the brand colour, not transparency.
     android.adaptiveIcon.backgroundColor in app.json matches the fill, so the
     two agree if a launcher ever letterboxes instead of cropping.

     The mark is smaller than in icon.svg so it stays inside the central 61%
     safe zone that every mask is guaranteed to keep. -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect width="1024" height="1024" fill="#4F46E5"/>
  <text x="512" y="620" font-family="Arial" font-size="300" fill="white" text-anchor="middle">TK</text>
</svg>
